tiktok_dataset:
  output_dir: "datasets/tiktok/mlbb"
  download_media: true
  max_entries_per_source: 50
  skip_existing_records: true

  # Keep proxy credentials out of git:
  # export TIKTOK_PROXY_URL="http://user:pass@host:port"
  proxy_url_env: "TIKTOK_PROXY_URL"
  proxy_url: null

  # Optional browser/exported cookies file if TikTok blocks public extraction.
  cookies_path: null

  sources:
    - label: "mlbb-official"
      profile_url: "https://www.tiktok.com/@mlbbttofficial"
      max_entries: 100
    - label: "mobile-legends"
      profile_url: "https://www.tiktok.com/@mobilelegendsgame"
      max_entries: 100
    - label: "mlbb-esports"
      profile_url: "https://www.tiktok.com/@mlbbesports_official"
      max_entries: 100
    - label: "mlbb-creator-1"
      profile_url: "https://www.tiktok.com/@example_mlbb_creator_1"
      max_entries: 100
    - label: "mlbb-creator-2"
      profile_url: "https://www.tiktok.com/@example_mlbb_creator_2"
      max_entries: 100
