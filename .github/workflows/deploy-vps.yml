name: Deploy to VPS

on:
  push:
    branches:
      - cursor/mlbb-video-pipeline-e712
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy scripts and restart bot
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            REPO="${{ secrets.VPS_REPO_PATH || '/root/content_bot_ml' }}"
            cd "$REPO"
            git fetch origin
            git checkout cursor/mlbb-video-pipeline-e712 || git checkout main
            git pull --ff-only
            bash scripts/install_mlbb_only_mode.sh
            bash scripts/mlbb_deploy_sync.sh
            systemctl restart telegram-upload-bot 2>/dev/null || true
            pkill -f mlbb_continuous_worker.py 2>/dev/null || true
            sleep 2
            nohup python3 /usr/local/bin/mlbb_continuous_worker.py >>/root/data/mlbb/mlbb_continuous_worker.log 2>&1 &
            echo "=== MLBB-only deploy done ==="
            grep -m1 BOT_VERSION /usr/local/bin/telegram_upload_bot.py || true
            pgrep -af telegram_upload_bot.py || true
            find /root/datasets/tiktok/mlbb -name '*.mp4' 2>/dev/null | wc -l
            tail -5 /root/data/mlbb/mass_download.log 2>/dev/null || true
