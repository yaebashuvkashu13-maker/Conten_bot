name: Deploy to VPS

on:
  push:
    branches:
      - cursor/vod-unified-production-a016
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve VPS host
        id: vps
        run: |
          host=""
          if [ -n "${{ secrets.VPS_HOST }}" ]; then
            host="${{ secrets.VPS_HOST }}"
          elif [ -n "${{ secrets.SSH_HOST }}" ]; then
            host="${{ secrets.SSH_HOST }}"
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          if [ -z "$host" ]; then
            echo "::warning::VPS_HOST/SSH_HOST not set — skip deploy (manual: deploy_unified_production.sh)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve VPS SSH key
        id: sshkey
        if: steps.vps.outputs.skip != '1'
        run: |
          if [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "has_key=1" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "has_key=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::VPS_SSH_KEY/SSH_PRIVATE_KEY not set — skip deploy"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy unified production
        if: steps.vps.outputs.skip != '1' && steps.sshkey.outputs.skip != '1' && steps.sshkey.outputs.has_key == '1'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.vps.outputs.host }}
          username: ${{ secrets.VPS_USER || secrets.SSH_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            REPO="${{ secrets.VPS_REPO_PATH || '/root/content_bot_ml' }}"
            BRANCH=cursor/vod-unified-production-a016
            cd "$REPO"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            CONTENT_BOT_REPO="$REPO" UNIFIED_BRANCH="$BRANCH" bash scripts/deploy_unified_production.sh
            echo "=== unified production deploy done ==="
            systemctl is-active content-bot-vod-feed.service || true
            pgrep -af 'mlbb_vod_segment_feed.sh|shooter_vod_segment_feed.py' || true
