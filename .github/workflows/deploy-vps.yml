name: Deploy to VPS

on:
  push:
    branches:
      - cursor/mlbb-video-pipeline-e712
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve VPS host
        id: vps
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "host=${{ secrets.VPS_HOST }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.SSH_HOST }}" ]; then
            echo "host=${{ secrets.SSH_HOST }}" >> "$GITHUB_OUTPUT"
          else
            echo "host=" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy scripts and restart bot
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.vps.outputs.host }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            REPO="${{ secrets.VPS_REPO_PATH || '/root/content_bot_ml' }}"
            cd "$REPO"
            git fetch origin
            git checkout cursor/mlbb-video-pipeline-e712 || git checkout main
            git pull --ff-only
            bash scripts/vps_apply_vod_only.sh
            echo "=== MLBB VOD-only deploy done ==="
            grep -m1 BOT_VERSION /usr/local/bin/telegram_upload_bot.py || true
            pgrep -af 'mlbb_vod_segment_feed|telegram_upload_bot' || true
            tail -8 /root/data/mlbb/mlbb_vod_segment_feed.log 2>/dev/null || true
