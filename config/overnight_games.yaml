# Daily batch: cron 18:00 MSK → Telegram montages by 08:00 MSK (5 games × 1 cut, sequential CPU).
# Fallback URLs (1.5h+) used when YouTube search finds no 2h+ VOD.
# Scene logic: MLBB=HUD gate; PUBG/Standoff=gunfire audio; Genshin/WoT=aggressive combat peaks (5 clips).

games:
  - id: mlbb
    profile: mobile_legends
    queue_label: MLBB
    montages: 1
    prefer_russian: true
    min_duration_sec: 7200
    max_duration_sec: 10800
    fallback_min_duration_sec: 5400
    search_limit: 12
    queries:
      - "MLBB стрим полный геймплей русский"
      - "Mobile Legends стрим ранкед русский"
      - "MLBB ranked stream replay full match"

  - id: pubg
    profile: pubg
    queue_label: PUBG Metro
    montages: 1
    require_metro_royale: true
    prefer_russian: true
    min_duration_sec: 7200
    max_duration_sec: 10800
    # Owner VOD (~90 min Metro Royale RU)
    fallback_min_duration_sec: 5400
    fallback_urls:
      - "https://www.youtube.com/live/FpMs48XOnq0"
    search_limit: 12
    queries:
      - "PUBG Mobile Metro Royale стрим"
      - "метро рояль пабг мобайл стрим полный"
      - "PUBG Mobile Metro Royale live русский"

  - id: genshin
    profile: genshin
    queue_label: Genshin
    montages: 1
    min_duration_sec: 7200
    max_duration_sec: 10800
    fallback_min_duration_sec: 5400
    fallback_urls:
      - "https://youtu.be/i67K34fQa9I"
    search_limit: 12
    queries:
      - "Genshin Impact live stream full"
      - "Genshin Impact gameplay stream replay"

  - id: standoff
    profile: standoff
    queue_label: Standoff
    montages: 1
    min_duration_sec: 7200
    max_duration_sec: 10800
    fallback_min_duration_sec: 5400
    fallback_urls:
      - "https://www.youtube.com/live/0pneRQba1rE"
    search_limit: 12
    queries:
      - "Standoff 2 live stream full gameplay"
      - "Standoff 2 ranked gameplay stream"

  - id: wot
    profile: world_of_tanks
    queue_label: WoT
    montages: 1
    min_duration_sec: 7200
    max_duration_sec: 10800
    fallback_min_duration_sec: 5400
    fallback_urls:
      - "https://www.youtube.com/live/-055vzCY-qk"
    search_limit: 12
    queries:
      - "World of Tanks live stream full gameplay"
      - "World of Tanks Modern Armor gameplay stream replay"
