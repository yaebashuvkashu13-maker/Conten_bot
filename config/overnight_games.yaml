# Midnight MSK batch: long YouTube streams → montages (one run until ~08:00 MSK).
# Scene logic: MLBB uses HUD gate; other games use motion/audio/scene scoring only.

games:
  - id: mlbb
    profile: mobile_legends
    queue_label: MLBB
    montages: 2
    min_duration_sec: 7200
    max_duration_sec: 10800
    search_limit: 12
    queries:
      - "Mobile Legends Bang Bang live stream full gameplay"
      - "MLBB ranked stream replay full match"

  - id: pubg
    profile: pubg
    queue_label: PUBG
    montages: 2
    min_duration_sec: 7200
    max_duration_sec: 10800
    # Owner VOD if search has no 2h+ stream (~90 min Metro Royale)
    fallback_min_duration_sec: 5400
    fallback_urls:
      - "https://www.youtube.com/live/FpMs48XOnq0"
    search_limit: 12
    queries:
      - "PUBG Mobile live stream full gameplay"
      - "PUBG Mobile ranked stream replay"

  - id: genshin
    profile: genshin
    queue_label: Genshin
    montages: 2
    min_duration_sec: 7200
    max_duration_sec: 10800
