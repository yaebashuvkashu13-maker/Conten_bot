[project]
name = "conten-bot"
version = "0.1.0"
description = "Content ingestion utilities for Instagram to Telegram workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "pytesseract",
  "PyYAML",
  "pandas",
  "scikit-learn",
  "joblib",
  "yt-dlp",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["content_bot*"]

