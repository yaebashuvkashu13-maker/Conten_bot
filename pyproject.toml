[project]
name = "conten-bot"
version = "0.1.0"
description = "Content ingestion utilities for Instagram to Telegram workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "PyYAML",
  "pandas",
  "requests[socks]",
  "scikit-learn",
  "yt-dlp",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

